<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Snake</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #0b0c10;
            font-family: 'Orbitron', sans-serif;
            color: #66fcf1;
            overflow: hidden;
        }

        h1 {
            margin-bottom: 20px;
            text-shadow: 0 0 10px #66fcf1, 0 0 20px #45a29e;
            letter-spacing: 2px;
        }

        #game-board {
            background-color: #111;
            border: 2px solid #66fcf1;
            border-radius: 4px;
            box-shadow: 0 0 15px #66fcf1, inset 0 0 10px #45a29e;
        }

        .score-container {
            display: flex;
            justify-content: space-between;
            width: 400px;
            margin-bottom: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            text-shadow: 0 0 5px #66fcf1;
        }

        button {
            padding: 10px 20px;
            font-size: 1rem;
            font-family: 'Orbitron', sans-serif;
            background-color: transparent;
            color: #66fcf1;
            border: 2px solid #66fcf1;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            box-shadow: 0 0 10px #66fcf1, inset 0 0 5px #45a29e;
        }

        button:hover {
            background-color: #66fcf1;
            color: #0b0c10;
            box-shadow: 0 0 20px #66fcf1, inset 0 0 10px #45a29e;
            text-shadow: none;
        }

        p {
            margin-top: 20px;
            color: #c5c6c7;
            font-size: 0.9rem;
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <h1>NEON SNAKE</h1>

    <div class="score-container">
        <div>SCORE: <span id="score">0</span></div>
        <div>BEST: <span id="high-score">0</span></div>
    </div>

    <canvas id="game-board" width="400" height="400"></canvas>

    <button id="restart-btn" style="display: none;">REBOOT</button>

    <p>Use as setas para mover. A cobra atravessa as bordas!</p>

    <script>
        const canvas = document.getElementById('game-board');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('high-score');
        const restartBtn = document.getElementById('restart-btn');

        // Configurações do jogo
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        let speed = 6; // Velocidade inicial reduzida
        let score = 0;
        let highScore = localStorage.getItem('snakeNeonHighScore') || 0;
        highScoreElement.textContent = highScore;

        let isGameOver = false;

        // Estado inicial
        let snake = [
            { x: 10, y: 10 }
        ];
        let velocity = { x: 0, y: 0 };
        let food = { x: 15, y: 15 };
        let nextVelocity = { x: 0, y: 0 };

        function drawGame() {
            if (isGameOver) {
                return;
            }

            clearScreen();
            changeSnakePosition();
            checkGameOver();

            if (isGameOver) {
                showGameOver();
                return;
            }

            checkFoodCollision();
            drawFood();
            drawSnake();

            setTimeout(drawGame, 1000 / speed);
        }

        function clearScreen() {
            // Desenha o fundo com padrão quadriculado
            for (let row = 0; row < tileCount; row++) {
                for (let col = 0; col < tileCount; col++) {
                    if ((row + col) % 2 === 0) {
                        ctx.fillStyle = '#0f1218'; // Cor mais escura
                    } else {
                        ctx.fillStyle = '#141821'; // Cor levemente mais clara
                    }
                    ctx.fillRect(col * gridSize, row * gridSize, gridSize, gridSize);
                }
            }
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                if (index === 0) {
                    ctx.fillStyle = '#66fcf1'; // Cabeça neon brilhante
                    ctx.shadowColor = '#66fcf1';
                    ctx.shadowBlur = 15; // Efeito de brilho neon
                } else {
                    ctx.fillStyle = '#45a29e'; // Corpo com brilho menor
                    ctx.shadowColor = '#45a29e';
                    ctx.shadowBlur = 5;
                }

                // Desenha a parte do corpo
                ctx.fillRect(part.x * gridSize + 1, part.y * gridSize + 1, gridSize - 2, gridSize - 2);

                // Reseta a sombra para não afetar outras coisas (essencial para performance)
                ctx.shadowBlur = 0;
            });
        }

        function changeSnakePosition() {
            velocity = { ...nextVelocity };

            if (velocity.x === 0 && velocity.y === 0) {
                return; // Jogo não começou ainda
            }

            const head = { ...snake[0] };
            head.x += velocity.x;
            head.y += velocity.y;

            // Lógica para atravessar paredes (teletransporte)
            if (head.x < 0) {
                head.x = tileCount - 1;
            } else if (head.x >= tileCount) {
                head.x = 0;
            }

            if (head.y < 0) {
                head.y = tileCount - 1;
            } else if (head.y >= tileCount) {
                head.y = 0;
            }

            snake.unshift(head);
            snake.pop(); // Remove rabo a não ser que tenha comido
        }

        function drawFood() {
            ctx.fillStyle = '#ff0055'; // Fruta rosa/vermelho neon
            ctx.shadowColor = '#ff0055';
            ctx.shadowBlur = 15;

            ctx.beginPath();
            ctx.arc(
                food.x * gridSize + gridSize / 2,
                food.y * gridSize + gridSize / 2,
                gridSize / 2 - 2,
                0,
                2 * Math.PI
            );
            ctx.fill();

            ctx.shadowBlur = 0; // Desliga o shadow pra não vazar
        }

        function checkFoodCollision() {
            const head = snake[0];
            if (head.x === food.x && head.y === food.y) {
                // Cresce a cobra
                snake.push({ ...snake[snake.length - 1] });

                score++;
                scoreElement.textContent = score;

                // Lógica de Recorde
                if (score > highScore) {
                    highScore = score;
                    highScoreElement.textContent = highScore;
                    localStorage.setItem('snakeNeonHighScore', highScore);
                }

                // Aumenta a velocidade mais suavemente com o tempo
                if (score % 4 === 0) {
                    speed += 0.5;
                }

                placeFood();
            }
        }

        function placeFood() {
            let safe = false;
            let attempts = 0;
            while (!safe && attempts < 1000) {
                food.x = Math.floor(Math.random() * tileCount);
                food.y = Math.floor(Math.random() * tileCount);

                safe = true;
                // Garante que a comida não apareça em cima da cobra
                for (let part of snake) {
                    if (part.x === food.x && part.y === food.y) {
                        safe = false;
                        break;
                    }
                }
                attempts++;
            }
        }

        function checkGameOver() {
            const head = snake[0];

            if (velocity.x === 0 && velocity.y === 0) return;

            // A única forma de perder é batendo no próprio corpo
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    isGameOver = true;
                    break;
                }
            }
        }

        function showGameOver() {
            // Fundo escurecido sem apagar o jogo
            ctx.fillStyle = 'rgba(11, 12, 16, 0.85)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Texto estilizado GAME OVER
            ctx.fillStyle = '#ff0055';
            ctx.shadowColor = '#ff0055';
            ctx.shadowBlur = 20;
            ctx.font = 'bold 36px Orbitron';
            ctx.textAlign = 'center';
            ctx.fillText('CRITICAL ERROR', canvas.width / 2, canvas.height / 2 - 20);

            // Exibir pontuação
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#c5c6c7';
            ctx.font = '20px Orbitron';
            ctx.fillText(`FINAL SCORE: ${score}`, canvas.width / 2, canvas.height / 2 + 30);

            // Mostrar Botão
            restartBtn.style.display = 'block';
            restartBtn.innerText = 'REBOOT SYSTEM';
        }

        function resetGame() {
            snake = [{ x: 10, y: 10 }];
            velocity = { x: 0, y: 0 };
            nextVelocity = { x: 0, y: 0 };
            score = 0;
            speed = 6;
            scoreElement.textContent = score;
            isGameOver = false;
            restartBtn.style.display = 'none';
            placeFood();
            drawGame();
        }

        // Sistema de Controle Direcional
        document.body.addEventListener('keydown', (event) => {
            // Evitar que as setas rolem a página
            if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(event.code) > -1) {
                event.preventDefault();
            }

            // Impedir movimentos diretamente opostos (pra não comer o próprio pescoço)
            if (event.key === 'ArrowUp' && velocity.y !== 1) {
                nextVelocity = { x: 0, y: -1 };
            }
            if (event.key === 'ArrowDown' && velocity.y !== -1) {
                nextVelocity = { x: 0, y: 1 };
            }
            if (event.key === 'ArrowLeft' && velocity.x !== 1) {
                nextVelocity = { x: -1, y: 0 };
            }
            if (event.key === 'ArrowRight' && velocity.x !== -1) {
                nextVelocity = { x: 1, y: 0 };
            }
        });

        restartBtn.addEventListener('click', resetGame);

        // Inicializa spawn e renderização
        placeFood();
        drawGame();

    </script>
</body>

</html>
