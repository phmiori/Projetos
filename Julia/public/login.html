<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar - Baúso</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #fafafa; }
    .font-cinzel { font-family: 'Cinzel', serif; }
    .gold-btn { background: #B8860B; color: white; transition: background .2s; }
    .gold-btn:hover { background: #9A7009; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <div id="navbar-root"></div>

  <main class="flex-grow flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-sm border p-8 w-full max-w-md" style="border-color:#EBD182">
      <h1 class="font-cinzel text-3xl font-bold mb-6 text-center" style="color:#2C1A08">Bem-vindo de volta</h1>
      
      <div id="msg-erro" class="hidden p-3 mb-4 bg-red-50 border border-red-200 text-red-600 rounded-lg text-sm text-center"></div>

      <form id="form-login" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">E-mail</label>
          <input type="email" name="email" required placeholder="seu@email.com" class="w-full border rounded-lg p-3 text-sm outline-none focus:border-yellow-600" style="border-color:#EBD182">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Senha</label>
          <input type="password" name="senha" required placeholder="••••••••" class="w-full border rounded-lg p-3 text-sm outline-none focus:border-yellow-600" style="border-color:#EBD182">
        </div>
        <button type="submit" id="btn-submit" class="gold-btn w-full font-bold py-3 rounded-xl text-md mt-4 shadow-md">
          Entrar na Conta
        </button>
      </form>
      
      <p class="text-center text-sm text-gray-500 mt-6">
        Ainda não tem conta? <a href="/cadastro.html" class="font-semibold" style="color:#B8860B">Cadastre-se</a>
      </p>
    </div>
  </main>

  <div id="footer-root" class="mt-auto"></div>

  <script src="/js/app.js"></script>
  <script>
    document.getElementById('navbar-root').innerHTML = navbarHTML();
    document.getElementById('footer-root').innerHTML = footerHTML();

    document.getElementById('form-login').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-submit');
      const msg = document.getElementById('msg-erro');
      btn.innerText = 'Entrando...';
      btn.disabled = true;
      msg.classList.add('hidden');

      const formData = new FormData(this);
      const data = Object.fromEntries(formData);

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const body = await res.json();
        
        if (!res.ok) {
          throw new Error(body.error || 'Erro ao fazer login.');
        }

        // Salvar token e usuário no localStorage
        localStorage.setItem('bauso_token', body.token);
        localStorage.setItem('bauso_user', JSON.stringify(body.usuario));
        
        window.location.href = '/';
      } catch (error) {
        msg.innerText = error.message;
        msg.classList.remove('hidden');
        btn.innerText = 'Entrar na Conta';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
