<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anunciar Tesouro - Baúso</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #fafafa; }
    .font-cinzel { font-family: 'Cinzel', serif; }
    .gold-btn { background: #B8860B; color: white; transition: background .2s; }
    .gold-btn:hover { background: #9A7009; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <div id="navbar-root"></div>

  <main class="flex-grow max-w-3xl mx-auto w-full px-4 py-12">
    <div class="bg-white rounded-2xl shadow-sm border p-6 sm:p-10" style="border-color:#EBD182">
      <h1 class="font-cinzel text-3xl font-bold mb-2 text-center" style="color:#2C1A08">Anunciar um Item</h1>
      <p class="text-gray-500 text-center mb-8">Ganhe dinheiro com o que você não está usando</p>
      
      <form id="form-anunciar" class="space-y-6">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Título do Anúncio</label>
          <input type="text" name="titulo" required placeholder="Ex: Câmera Canon T7i, Furadeira Bosch..." class="w-full border rounded-lg p-3 text-sm outline-none focus:border-yellow-600 transition-colors" style="border-color:#EBD182">
        </div>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Categoria</label>
            <select name="categoria" id="select-categoria" required class="w-full border rounded-lg p-3 text-sm outline-none focus:border-yellow-600 bg-white" style="border-color:#EBD182">
              <option value="">Selecione...</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Preço Diário (R$)</label>
            <input type="number" step="0.01" name="precoDiario" required placeholder="0.00" class="w-full border rounded-lg p-3 text-sm outline-none focus:border-yellow-600 transition-colors" style="border-color:#EBD182">
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Descrição</label>
          <textarea name="descricao" required rows="4" placeholder="Descreva o estado do item, se acompanha acessórios, etc." class="w-full border rounded-lg p-3 text-sm outline-none focus:border-yellow-600 transition-colors resize-none" style="border-color:#EBD182"></textarea>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Foto do Item</label>
          <input type="file" name="imagem" accept="image/*" class="w-full border rounded-lg p-2 text-sm text-gray-600 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-yellow-50 file:text-yellow-700 hover:file:bg-yellow-100" style="border-color:#EBD182">
        </div>

        <button type="submit" id="btn-submit" class="gold-btn w-full font-bold py-4 rounded-xl text-lg mt-8 shadow-md hover:shadow-lg">
          Publicar Anúncio
        </button>
      </form>
      
      <div id="mensagem-sucesso" class="hidden mt-8 p-4 bg-green-50 border border-green-200 rounded-xl text-green-800 text-center">
        🎉 Anúncio publicado com sucesso! <br>
        <a href="/explorar.html" class="font-bold underline mt-2 inline-block">Ver seus itens na loja</a>
      </div>
    </div>
  </main>

  <div id="footer-root" class="mt-auto"></div>

  <script src="/js/app.js"></script>
  <script>
    document.getElementById('navbar-root').innerHTML = navbarHTML();
    document.getElementById('footer-root').innerHTML = footerHTML();

    const selectCat = document.getElementById('select-categoria');
    CATEGORIAS.forEach(cat => {
      selectCat.innerHTML += `<option value="${cat.id}">${cat.emoji} ${cat.nome}</option>`;
    });

    // Verificar login antes de anunciar
    if (!localStorage.getItem('bauso_token')) {
      alert('Você precisa estar logado para anunciar um item!');
      window.location.href = '/login.html';
    }

    document.getElementById('form-anunciar').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const btn = document.getElementById('btn-submit');
      const form = this;
      btn.innerText = 'Publicando...';
      btn.disabled = true;

      const formData = new FormData(form);
      const token = localStorage.getItem('bauso_token');

      try {
        const res = await fetch('/api/itens', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`
          },
          body: formData
        });

        if (res.status === 401 || res.status === 403) {
           throw new Error('Sessão expirada. Faça login novamente.');
        }

        if (!res.ok) throw new Error('Erro na requisição');
        
        form.style.display = 'none';
        document.getElementById('mensagem-sucesso').classList.remove('hidden');
      } catch (error) {
        alert('Ocorreu um erro ao publicar o anúncio.');
        console.error(error);
        btn.innerText = 'Publicar Anúncio';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
