<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhes do Item - Baúso</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #fafafa; }
    .font-cinzel { font-family: 'Cinzel', serif; }
    .gold-btn { background: #B8860B; color: white; transition: all .2s; }
    .gold-btn:hover { background: #9A7009; transform: translateY(-1px); box-shadow: 0 8px 20px rgba(184,134,11,0.3); }
    input[type="date"] { color-scheme: light; }
    .badge-pago { background: #dcfce7; color: #166534; }
    .badge-pendente { background: #fef9c3; color: #854d0e; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <div id="navbar-root"></div>

  <main class="flex-grow max-w-5xl mx-auto w-full px-4 py-8">
    <div id="loading" class="text-center py-20 text-gray-500 text-lg">Carregando detalhes...</div>

    <div id="item-content" class="hidden">
      <nav class="text-sm text-gray-500 mb-6 flex items-center gap-2">
        <a href="/" class="hover:text-yellow-600">Início</a>
        <span>/</span>
        <a href="/explorar.html" class="hover:text-yellow-600" id="bread-cat">Categoria</a>
        <span>/</span>
        <span class="text-gray-900 font-medium" id="bread-nome">Item</span>
      </nav>

      <div class="flex flex-col lg:flex-row gap-8">

        <!-- Coluna Esquerda: imagem + info -->
        <div class="lg:w-3/5 flex flex-col gap-6">
          <div class="bg-white rounded-3xl border overflow-hidden shadow-sm" style="border-color:#EBD182">
            <div class="aspect-[4/3] bg-gray-100 relative">
              <img id="item-img" src="" alt="Imagem do item" class="w-full h-full object-cover">
              <div class="absolute top-4 left-4 bg-white/90 backdrop-blur-sm px-3 py-1.5 rounded-lg text-sm font-bold flex items-center gap-1 shadow-sm" style="color:#5C3A1E" id="item-cat-badge">Categoria</div>
            </div>
            <div class="p-6">
              <h1 id="item-titulo" class="font-cinzel text-3xl font-bold mb-4" style="color:#2C1A08"></h1>
              <div class="flex items-center gap-3 mb-5 pb-5 border-b" style="border-color:#F5E6C4">
                <div class="w-11 h-11 bg-yellow-50 border rounded-full flex items-center justify-center text-xl" style="border-color:#EBD182">👤</div>
                <div>
                  <p class="text-sm font-bold text-gray-900" id="item-anunciante-nome"></p>
                  <p class="text-xs text-gray-500">Anunciante verificado • ★ 5.0</p>
                </div>
              </div>
              <h3 class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Descrição</h3>
              <p id="item-descricao" class="text-gray-700 text-sm leading-relaxed whitespace-pre-wrap"></p>
            </div>
          </div>
        </div>

        <!-- Coluna Direita: reserva + pagamento -->
        <div class="lg:w-2/5">
          <div class="bg-white rounded-3xl border shadow-sm p-6 sticky top-24" style="border-color:#EBD182">

            <div class="flex items-end gap-1 mb-6 pb-6 border-b" style="border-color:#F5E6C4">
              <span class="text-4xl font-black" style="color:#2C1A08" id="item-preco">R$ 0,00</span>
              <span class="text-gray-500 text-sm font-medium mb-1">/dia</span>
            </div>

            <div id="painel-reserva">
              <h3 class="text-sm font-bold text-gray-700 mb-3 uppercase tracking-wider">Escolha as datas</h3>
              <div class="grid grid-cols-2 gap-3 mb-4">
                <div>
                  <label class="text-xs font-semibold text-gray-500 block mb-1">Início</label>
                  <input type="date" id="data-inicio" class="w-full border rounded-xl p-2.5 text-sm outline-none focus:ring-2 focus:ring-yellow-400" style="border-color:#EBD182">
                </div>
                <div>
                  <label class="text-xs font-semibold text-gray-500 block mb-1">Devolução</label>
                  <input type="date" id="data-fim" class="w-full border rounded-xl p-2.5 text-sm outline-none focus:ring-2 focus:ring-yellow-400" style="border-color:#EBD182">
                </div>
              </div>

              <div id="resumo-preco" class="hidden bg-yellow-50 border rounded-2xl p-4 mb-4 text-sm" style="border-color:#EBD182">
                <div class="flex justify-between text-gray-600 mb-1">
                  <span id="resumo-dias-label">R$ 0 × 1 dia</span>
                  <span id="resumo-subtotal">R$ 0,00</span>
                </div>
                <div class="flex justify-between text-gray-400 text-xs mb-3">
                  <span>Taxa de serviço Baúso (10%)</span>
                  <span id="resumo-taxa">R$ 0,00</span>
                </div>
                <div class="flex justify-between font-bold text-base" style="color:#2C1A08">
                  <span>Total</span>
                  <span id="resumo-total">R$ 0,00</span>
                </div>
              </div>

              <div id="msg-reserva-erro" class="hidden p-3 mb-3 bg-red-50 border border-red-200 text-red-600 rounded-lg text-sm text-center"></div>

              <button id="btn-reservar" onclick="fazerReserva()" disabled
                class="gold-btn w-full font-bold py-4 rounded-xl text-base shadow-md flex items-center justify-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed disabled:transform-none disabled:shadow-none">
                Selecione as datas
              </button>
              <p class="text-xs text-center text-gray-400 mt-3">Pagamento seguro via Mercado Pago</p>
            </div>

          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-root" class="mt-auto"></div>

  <script src="/js/app.js"></script>
  <script>
    document.getElementById('navbar-root').innerHTML = navbarHTML();
    document.getElementById('footer-root').innerHTML = footerHTML();

    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');
    let precoDiario = 0;

    // Definir data mínima como hoje
    const hoje = new Date().toISOString().split('T')[0];
    document.getElementById('data-inicio').min = hoje;
    document.getElementById('data-fim').min = hoje;

    // Atualizar resumo de preço ao mudar datas
    function atualizarResumo() {
      const inicio = document.getElementById('data-inicio').value;
      const fim = document.getElementById('data-fim').value;
      const btn = document.getElementById('btn-reservar');
      const resumo = document.getElementById('resumo-preco');

      if (!inicio || !fim || fim <= inicio) {
        resumo.classList.add('hidden');
        btn.disabled = true;
        btn.innerHTML = inicio && fim && fim <= inicio ? '⚠️ Data de devolução inválida' : 'Selecione as datas';
        return;
      }

      const inicioDate = new Date(inicio + 'T12:00:00');
      const fimDate = new Date(fim + 'T12:00:00');
      const dias = Math.ceil((fimDate - inicioDate) / (1000 * 60 * 60 * 24));
      const total = dias * precoDiario;
      const taxa = total * 0.10;

      document.getElementById('resumo-dias-label').innerText = `R$ ${precoDiario.toFixed(2).replace('.',',')} × ${dias} dia${dias > 1 ? 's' : ''}`;
      document.getElementById('resumo-subtotal').innerText = `R$ ${total.toFixed(2).replace('.',',')}`;
      document.getElementById('resumo-taxa').innerText = `R$ ${taxa.toFixed(2).replace('.',',')}`;
      document.getElementById('resumo-total').innerText = `R$ ${total.toFixed(2).replace('.',',')}`;

      resumo.classList.remove('hidden');
      btn.disabled = false;
      btn.innerHTML = `<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.11 0-2 .89-2 2v12c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/></svg> Reservar e Pagar`;
    }

    document.getElementById('data-inicio').addEventListener('change', () => {
      const inicio = document.getElementById('data-inicio').value;
      document.getElementById('data-fim').min = inicio;
      atualizarResumo();
    });
    document.getElementById('data-fim').addEventListener('change', atualizarResumo);

    async function fazerReserva() {
      const token = localStorage.getItem('bauso_token');
      if (!token) {
        alert('Você precisa estar logado para fazer uma reserva!');
        window.location.href = '/login.html';
        return;
      }

      const btn = document.getElementById('btn-reservar');
      const msgErro = document.getElementById('msg-reserva-erro');
      msgErro.classList.add('hidden');
      btn.disabled = true;
      btn.innerHTML = 'Processando...';

      try {
        const res = await fetch('/api/reservas', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            itemId: id,
            dataInicio: document.getElementById('data-inicio').value,
            dataFim: document.getElementById('data-fim').value
          })
        });

        const body = await res.json();
        if (!res.ok) throw new Error(body.error || 'Erro ao criar reserva.');

        // Redirecionar para o checkout do Mercado Pago
        // Em sandbox usa sandboxUrl, em produção usa checkoutUrl
        const checkoutUrl = body.sandboxUrl || body.checkoutUrl;
        window.location.href = checkoutUrl;

      } catch (error) {
        msgErro.innerText = error.message;
        msgErro.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = `<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.11 0-2 .89-2 2v12c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/></svg> Reservar e Pagar`;
      }
    }

    async function carregarItem() {
      if (!id) { window.location.href = '/explorar.html'; return; }
      try {
        const res = await fetch(`/api/itens/${id}`);
        if (!res.ok) throw new Error('Item não encontrado');
        const item = await res.json();
        const cat = CATEGORIAS.find(c => c.id === item.categoria) || CATEGORIAS[0];
        precoDiario = item.precoDiario;

        document.title = `${item.titulo} - Baúso`;
        document.getElementById('bread-cat').innerText = cat.nome;
        document.getElementById('bread-nome').innerText = item.titulo;
        document.getElementById('item-titulo').innerText = item.titulo;
        document.getElementById('item-descricao').innerText = item.descricao;
        document.getElementById('item-preco').innerText = `R$ ${item.precoDiario.toFixed(2).replace('.', ',')}`;
        document.getElementById('item-anunciante-nome').innerText = item.anunciante.nome;
        document.getElementById('item-cat-badge').innerText = `${cat.emoji} ${cat.nome}`;

        const imageUrl = item.imagemUrl ? (item.imagemUrl.startsWith('http') ? item.imagemUrl : `/${item.imagemUrl}`) : 'https://via.placeholder.com/600x400?text=Sem+Imagem';
        document.getElementById('item-img').src = imageUrl;

        document.getElementById('loading').style.display = 'none';
        document.getElementById('item-content').classList.remove('hidden');
      } catch (error) {
        document.getElementById('loading').innerHTML = `
          <div class="text-6xl mb-4">😢</div>
          <h2 class="text-2xl font-bold mb-2">Item não encontrado</h2>
          <a href="/explorar.html" class="gold-btn px-6 py-2 rounded-xl mt-6 inline-block font-bold">Explorar outros itens</a>
        `;
      }
    }

    carregarItem();
  </script>
</body>
</html>
