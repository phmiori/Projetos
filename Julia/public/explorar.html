<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explorar Tesouros - Baúso</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #fafafa; }
    .font-cinzel { font-family: 'Cinzel', serif; }
    .gold-btn { background: #B8860B; color: white; transition: background .2s; }
    .gold-btn:hover { background: #9A7009; }
    .line-clamp-2 { display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <div id="navbar-root"></div>

  <main class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-10">
    <div class="mb-8 flex flex-col sm:flex-row justify-between items-start sm:items-end gap-4">
      <div>
        <h1 class="font-cinzel text-3xl font-bold mb-2" style="color:#2C1A08">Explorar Itens</h1>
        <p class="text-sm text-gray-500" id="resultados-texto">Carregando...</p>
      </div>
      
      <!-- Barra de busca no topo -->
      <form id="form-busca" class="bg-white rounded-xl p-2 flex gap-2 w-full sm:w-auto shadow-sm border" style="border-color:#EBD182">
        <select id="filtro-categoria" class="text-sm text-gray-600 border-none outline-none bg-transparent pl-2 pr-1 font-medium max-w-[150px]">
          <option value="">Todas as categorias</option>
        </select>
        <div class="w-px bg-gray-200"></div>
        <input id="input-busca" type="text" placeholder="O que você precisa?" class="flex-1 sm:w-64 text-gray-700 outline-none text-sm px-2">
        <button type="submit" class="gold-btn font-bold px-4 py-2 rounded-lg text-sm">Buscar</button>
      </form>
    </div>

    <!-- Grid de resultados -->
    <div id="grid-resultados" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      <!-- Skeleton loader ou itens -->
    </div>
  </main>

  <div id="footer-root" class="mt-auto"></div>

  <script src="/js/app.js"></script>
  <script>
    document.getElementById('navbar-root').innerHTML = navbarHTML();
    document.getElementById('footer-root').innerHTML = footerHTML();

    const selectCat = document.getElementById('filtro-categoria');
    CATEGORIAS.forEach(cat => {
      selectCat.innerHTML += `<option value="${cat.id}">${cat.emoji} ${cat.nome}</option>`;
    });

    const urlParams = new URLSearchParams(window.location.search);
    const q = urlParams.get('q') || '';
    const categoria = urlParams.get('categoria') || '';

    document.getElementById('input-busca').value = q;
    if(categoria) selectCat.value = categoria;

    async function carregarResultados() {
      const grid = document.getElementById('grid-resultados');
      grid.innerHTML = '<p class="col-span-full text-center text-gray-500 py-10">Buscando tesouros...</p>';

      const itens = await getItens(q, categoria);
      
      const texto = document.getElementById('resultados-texto');
      if (itens.length === 0) {
        texto.innerText = 'Nenhum item encontrado para sua busca.';
        grid.innerHTML = `<div class="col-span-full text-center py-20">
          <div class="text-6xl mb-4">🕵️</div>
          <h3 class="text-xl font-bold mb-2">Ops! Nada encontrado</h3>
          <p class="text-gray-500">Tente buscar por termos diferentes ou altere a categoria.</p>
        </div>`;
      } else {
        texto.innerText = `Mostrando ${itens.length} resultado(s)`;
        grid.innerHTML = '';
        itens.forEach(item => {
          grid.innerHTML += renderizarCard(item);
        });
      }
    }

    document.getElementById('form-busca').addEventListener('submit', function(e) {
      e.preventDefault();
      const newQ = document.getElementById('input-busca').value.trim();
      const newCat = selectCat.value;
      window.location.href = `/explorar.html?q=${encodeURIComponent(newQ)}&categoria=${newCat}`;
    });

    carregarResultados();
  </script>
</body>
</html>
