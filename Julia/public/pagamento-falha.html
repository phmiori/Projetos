<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento Não Concluído - Baúso</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #fafafa; }
    .font-cinzel { font-family: 'Cinzel', serif; }
    .gold-btn { background: #B8860B; color: white; transition: background .2s; }
    .gold-btn:hover { background: #9A7009; }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <div id="navbar-root"></div>

  <main class="flex-grow flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl border shadow-sm p-10 w-full max-w-md text-center" style="border-color:#EBD182">
      <div class="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center text-4xl mx-auto mb-6">❌</div>
      <h1 class="font-cinzel text-3xl font-bold mb-3" style="color:#2C1A08">Pagamento não concluído</h1>
      <p class="text-gray-500 mb-8">Não se preocupe! Sua reserva ficou salva. Você pode tentar pagar novamente a qualquer momento pela seção "Minhas Reservas".</p>

      <div class="flex flex-col gap-3">
        <a href="/minha-conta.html" class="gold-btn w-full font-bold py-3 rounded-xl shadow-md">Tentar Novamente</a>
        <a href="/" class="w-full font-bold py-3 rounded-xl border text-gray-700 hover:bg-gray-50" style="border-color:#EBD182">Voltar ao Início</a>
      </div>
    </div>
  </main>

  <div id="footer-root" class="mt-auto"></div>
  <script src="/js/app.js"></script>
  <script>
    document.getElementById('navbar-root').innerHTML = navbarHTML();
    document.getElementById('footer-root').innerHTML = footerHTML();
  </script>
</body>
</html>
