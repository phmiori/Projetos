<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Conta - Baúso</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #fafafa; }
    .font-cinzel { font-family: 'Cinzel', serif; }
    .gold-btn { background: #B8860B; color: white; transition: background .2s; }
    .gold-btn:hover { background: #9A7009; }
    .tab-active { background: #B8860B; color: white; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 9999px; font-size: .7rem; font-weight: 700; }
    .badge-pago { background: #dcfce7; color: #166534; }
    .badge-pendente { background: #fef9c3; color: #854d0e; }
    .badge-cancelado { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <div id="navbar-root"></div>

  <main class="max-w-5xl mx-auto w-full px-4 py-8 flex-grow">
    <div class="flex items-center gap-4 mb-8">
      <div class="w-14 h-14 bg-yellow-50 rounded-full flex items-center justify-center text-3xl border" style="border-color:#EBD182">👤</div>
      <div>
        <h1 class="font-cinzel text-2xl font-bold" style="color:#2C1A08" id="user-nome">Minha Conta</h1>
        <p class="text-gray-500 text-sm" id="user-email"></p>
      </div>
    </div>

    <!-- Abas -->
    <div class="flex gap-2 mb-6 border-b pb-4" style="border-color:#EBD182">
      <button onclick="mostrarAba('meus-alugueis')" id="tab-meus-alugueis" class="tab-active px-5 py-2 rounded-xl text-sm font-bold transition-all">Meus Aluguéis</button>
      <button onclick="mostrarAba('meus-anuncios')" id="tab-meus-anuncios" class="px-5 py-2 rounded-xl text-sm font-bold text-gray-600 hover:bg-gray-100 transition-all">Meus Anúncios</button>
      <button onclick="mostrarAba('minhas-locacoes')" id="tab-minhas-locacoes" class="px-5 py-2 rounded-xl text-sm font-bold text-gray-600 hover:bg-gray-100 transition-all">Clientes (Locações)</button>
    </div>

    <!-- Conteúdo das abas -->
    <div id="aba-meus-alugueis">
      <div id="lista-alugueis" class="space-y-3">
        <p class="text-gray-400 text-sm">Carregando...</p>
      </div>
    </div>

    <div id="aba-meus-anuncios" class="hidden">
      <div class="flex justify-between items-center mb-4">
        <h2 class="font-bold text-lg" style="color:#2C1A08">Itens que você anunciou</h2>
        <a href="/anunciar.html" class="gold-btn px-4 py-2 rounded-xl text-sm font-bold">+ Novo Anúncio</a>
      </div>
      <div id="lista-anuncios" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <p class="text-gray-400 text-sm">Carregando...</p>
      </div>
    </div>

    <div id="aba-minhas-locacoes" class="hidden">
      <h2 class="font-bold text-lg mb-4" style="color:#2C1A08">Clientes que reservaram seus itens</h2>
      <div id="lista-locacoes" class="space-y-3">
        <p class="text-gray-400 text-sm">Carregando...</p>
      </div>
    </div>
  </main>

  <div id="footer-root" class="mt-auto"></div>

  <script src="/js/app.js"></script>
  <script>
    document.getElementById('navbar-root').innerHTML = navbarHTML();
    document.getElementById('footer-root').innerHTML = footerHTML();

    const token = localStorage.getItem('bauso_token');
    const user = JSON.parse(localStorage.getItem('bauso_user') || 'null');

    if (!token || !user) {
      alert('Você precisa estar logado para acessar sua conta.');
      window.location.href = '/login.html';
    }

    document.getElementById('user-nome').innerText = user.nome;
    document.getElementById('user-email').innerText = user.email;

    function mostrarAba(aba) {
      ['meus-alugueis','meus-anuncios','minhas-locacoes'].forEach(a => {
        document.getElementById(`aba-${a}`).classList.add('hidden');
        document.getElementById(`tab-${a}`).classList.remove('tab-active');
        document.getElementById(`tab-${a}`).classList.add('text-gray-600');
      });
      document.getElementById(`aba-${aba}`).classList.remove('hidden');
      document.getElementById(`tab-${aba}`).classList.add('tab-active');
      document.getElementById(`tab-${aba}`).classList.remove('text-gray-600');
    }

    function badgeStatus(status) {
      const classes = { pago: 'badge-pago', pendente: 'badge-pendente', cancelado: 'badge-cancelado' };
      const labels = { pago: '✅ Pago', pendente: '⏳ Pendente', cancelado: '❌ Cancelado' };
      return `<span class="badge ${classes[status] || 'badge-pendente'}">${labels[status] || status}</span>`;
    }

    function renderizarCardAnuncio(item) {
      const imageUrl = item.imagemUrl ? `/${item.imagemUrl}` : 'https://via.placeholder.com/300x200?text=Sem+Foto';
      return `
        <div class="bg-white rounded-2xl border overflow-hidden hover:shadow-md transition-all" style="border-color:#EBD182">
          <div class="aspect-video bg-gray-100 relative">
            <img src="${imageUrl}" class="w-full h-full object-cover" alt="${item.titulo}">
          </div>
          <div class="p-4">
            <h3 class="font-bold text-gray-900 text-sm mb-1 line-clamp-1">${item.titulo}</h3>
            <p class="text-yellow-700 font-black text-base">R$ ${item.precoDiario.toFixed(2).replace('.',',')} <span class="text-gray-400 text-xs font-normal">/dia</span></p>
            <a href="/item.html?id=${item.id}" class="mt-3 block text-center border rounded-lg py-1.5 text-xs font-bold text-gray-700 hover:bg-gray-50 transition" style="border-color:#EBD182">Ver Anúncio</a>
          </div>
        </div>
      `;
    }

    async function carregarConta() {
      try {
        const res = await fetch('/api/minha-conta', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.status === 401 || res.status === 403) {
          localStorage.clear();
          window.location.href = '/login.html';
          return;
        }
        const data = await res.json();

        // Aluguéis (como locatário)
        const listaAlugueis = document.getElementById('lista-alugueis');
        if (data.reservasComoLocatario.length === 0) {
          listaAlugueis.innerHTML = '<p class="text-gray-400 text-sm text-center py-8">Você ainda não fez nenhuma reserva. <a href="/explorar.html" class="text-yellow-700 font-bold">Explore os itens disponíveis →</a></p>';
        } else {
          listaAlugueis.innerHTML = data.reservasComoLocatario.map(r => {
            const inicio = new Date(r.dataInicio).toLocaleDateString('pt-BR');
            const fim = new Date(r.dataFim).toLocaleDateString('pt-BR');
            const img = r.item.imagemUrl ? `/${r.item.imagemUrl}` : 'https://via.placeholder.com/80x60?text=Item';
            return `
              <div class="bg-white rounded-2xl border p-4 flex items-center gap-4" style="border-color:#EBD182">
                <img src="${img}" class="w-16 h-16 rounded-xl object-cover flex-shrink-0" alt="${r.item.titulo}">
                <div class="flex-grow min-w-0">
                  <div class="flex items-center gap-2 mb-1">
                    <p class="font-bold text-sm text-gray-900 truncate">${r.item.titulo}</p>
                    ${badgeStatus(r.status)}
                  </div>
                  <p class="text-xs text-gray-500">${inicio} → ${fim} · ${r.totalDias} dia${r.totalDias > 1 ? 's' : ''}</p>
                </div>
                <p class="font-black text-base flex-shrink-0" style="color:#2C1A08">R$ ${r.valorTotal.toFixed(2).replace('.',',')}</p>
              </div>
            `;
          }).join('');
        }

        // Anúncios
        const listaAnuncios = document.getElementById('lista-anuncios');
        if (data.itens.length === 0) {
          listaAnuncios.innerHTML = '<p class="text-gray-400 text-sm text-center py-8 col-span-3">Você não tem nenhum anúncio. <a href="/anunciar.html" class="text-yellow-700 font-bold">Crie o seu primeiro →</a></p>';
        } else {
          listaAnuncios.innerHTML = data.itens.map(renderizarCardAnuncio).join('');
        }

        // Locações (como anunciante)
        const listaLocacoes = document.getElementById('lista-locacoes');
        if (data.reservasComoAnunciante.length === 0) {
          listaLocacoes.innerHTML = '<p class="text-gray-400 text-sm text-center py-8">Nenhum cliente reservou seus itens ainda.</p>';
        } else {
          listaLocacoes.innerHTML = data.reservasComoAnunciante.map(r => {
            const inicio = new Date(r.dataInicio).toLocaleDateString('pt-BR');
            const fim = new Date(r.dataFim).toLocaleDateString('pt-BR');
            return `
              <div class="bg-white rounded-2xl border p-4" style="border-color:#EBD182">
                <div class="flex items-center justify-between mb-2">
                  <div>
                    <p class="font-bold text-sm text-gray-900">${r.item.titulo}</p>
                    <p class="text-xs text-gray-500">${inicio} → ${fim} · ${r.totalDias} dia${r.totalDias > 1 ? 's' : ''}</p>
                  </div>
                  ${badgeStatus(r.status)}
                </div>
                <div class="border-t pt-3 mt-2" style="border-color:#F5E6C4">
                  <p class="text-xs text-gray-500 mb-1">Locatário</p>
                  <p class="text-sm font-bold">${r.locatario.nome} — <span class="font-normal text-gray-500">${r.locatario.email}</span></p>
                  ${r.locatario.telefone ? `<p class="text-xs text-gray-500 mt-1">📱 ${r.locatario.telefone}</p>` : ''}
                </div>
                <div class="flex justify-between items-center mt-3 pt-3 border-t" style="border-color:#F5E6C4">
                  <span class="text-xs text-gray-400">Você receberá (90%)</span>
                  <span class="font-black text-green-700">R$ ${r.valorAnunciante.toFixed(2).replace('.',',')}</span>
                </div>
              </div>
            `;
          }).join('');
        }
      } catch (error) {
        console.error(error);
      }
    }

    carregarConta();
  </script>
</body>
</html>
