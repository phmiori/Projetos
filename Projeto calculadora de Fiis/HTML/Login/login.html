<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/icons/favicon.png">
    <meta name="theme-color" content="#EEBB00">
    <script defer src="/JS/Global/pwa-register.js"></script>
    <meta name="description" content="FinanceHub - Login do Sistema">
    <title>Login - FinanceHub</title>

    <link rel="stylesheet" href="../../CSS/Global/global_tokens.css">
    <link rel="stylesheet" href="../../CSS/Login/login.css">

    <script src="../../JS/Login/login.js" defer></script>
</head>
<body class="login-body">

    <main class="login-wrapper">
        <div class="login-card">
            <div class="login-brand">
                <div class="login-brand-icon">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"></path>
                        <circle cx="7" cy="17" r="2"></circle>
                        <path d="M9 17h6"></path>
                        <circle cx="17" cy="17" r="2"></circle>
                    </svg>
                </div>
                <span class="login-brand-title">FinanceHub</span>
            </div>

            <h1 class="login-title">Acessar o Sistema</h1>
            <p class="login-subtitle">Entre com seu usuário e senha para continuar.</p>

            <form id="loginForm" class="login-form">
                <div class="input-field">
                    <label for="inputUsername">Usuário</label>
                    <input type="text" id="inputUsername" class="input-missao" required autocomplete="username" placeholder="Seu usuário">
                </div>
                <div class="input-field">
                    <label for="inputSenha">Senha</label>
                    <input type="password" id="inputSenha" class="input-missao" required autocomplete="current-password" placeholder="Sua senha">
                </div>

                <p class="login-error" id="loginError" style="display:none;"></p>

                <button type="submit" class="btn-missao-primary login-submit-btn" id="btnLoginSubmit">Entrar</button>
            </form>
        </div>
    </main>

</body>
</html>
