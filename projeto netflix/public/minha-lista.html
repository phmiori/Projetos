<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minha Lista — Flixora</title>
  <meta name="description" content="Sua lista de filmes e séries salvos no Flixora." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>" />
  <link rel="stylesheet" href="css/browse.css" />
  <style>
    /* ---- Minha Lista extras ---- */
    .my-list-header {
      padding: 120px 60px 40px;
    }
    .my-list-header h1 {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 800;
      margin-bottom: 8px;
    }
    .my-list-header p {
      color: #aaa;
      font-size: 1rem;
    }
    .my-list-content {
      padding: 0 60px 80px;
      min-height: 50vh;
    }

    /* Grid de cards da lista */
    .list-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
      gap: 12px;
    }

    .list-card {
      position: relative;
      border-radius: 6px;
      overflow: hidden;
      aspect-ratio: 2/3;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      animation: fadeInCard 0.5s ease both;
    }

    @keyframes fadeInCard {
      from { opacity: 0; transform: scale(0.92); }
      to   { opacity: 1; transform: scale(1); }
    }

    .list-card:hover {
      transform: scale(1.05);
      z-index: 10;
      box-shadow: 0 12px 40px rgba(0,0,0,0.8);
    }

    .list-card-bg {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      text-align: center;
    }

    .list-card-emoji {
      font-size: 2.5rem;
    }

    .list-card-title {
      font-size: 0.85rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .list-card-genre {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.6);
    }

    /* Hover overlay */
    .list-card-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.0);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 16px;
      transition: background 0.3s ease;
    }

    .list-card:hover .list-card-overlay {
      background: rgba(0,0,0,0.55);
    }

    .list-card-actions {
      display: flex;
      gap: 8px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .list-card:hover .list-card-actions {
      opacity: 1;
      transform: translateY(0);
    }

    .list-action-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.7);
      background: rgba(0,0,0,0.6);
      color: white;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, border-color 0.2s ease;
    }
    .list-action-btn:hover { background: rgba(255,255,255,0.15); border-color: #fff; }
    .list-action-btn.play { background: #fff; color: #000; border-color: #fff; }
    .list-action-btn.play:hover { background: rgba(255,255,255,0.85); }
    .list-action-btn.remove { border-color: rgba(229,9,20,0.6); color: #e50914; }
    .list-action-btn.remove:hover { background: rgba(229,9,20,0.2); border-color: #e50914; }

    /* Empty state */
    .empty-list {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 24px;
      gap: 20px;
      text-align: center;
    }
    .empty-icon {
      font-size: 5rem;
      animation: bounce 2s ease-in-out infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-12px); }
    }
    .empty-title {
      font-size: 1.5rem;
      font-weight: 700;
    }
    .empty-sub {
      color: #888;
      font-size: 0.95rem;
      max-width: 360px;
      line-height: 1.6;
    }
    .btn-browse {
      padding: 12px 32px;
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .btn-browse:hover { background: var(--red-hover); }

    /* Count badge */
    .list-count {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 0.82rem;
      color: #bbb;
      margin-top: 12px;
    }

    /* Toast notification */
    .toast {
      position: fixed;
      bottom: 32px;
      right: 32px;
      background: #222;
      border: 1px solid rgba(255,255,255,0.12);
      color: #fff;
      padding: 14px 20px;
      border-radius: 6px;
      font-size: 0.9rem;
      z-index: 9999;
      transform: translateY(80px);
      opacity: 0;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease;
      pointer-events: none;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    @media (max-width: 768px) {
      .my-list-header, .my-list-content { padding-left: 24px; padding-right: 24px; }
      .list-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
    }
  </style>
</head>
<body>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- ==================== NAVBAR ==================== -->
  <nav class="browse-navbar" id="browse-navbar">
    <div class="nav-left">
      <a href="browse.html" class="nav-logo">Flixora</a>
      <ul class="nav-links">
        <li><a href="browse.html">Início</a></li>
        <li><a href="#">Séries</a></li>
        <li><a href="#">Filmes</a></li>
        <li><a href="#">Em Alta</a></li>
        <li><a href="minha-lista.html" class="active">Minha Lista</a></li>
      </ul>
    </div>
    <div class="nav-right">
      <div class="nav-search-container" id="search-container">
        <button class="nav-search-btn" title="Buscar" id="search-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
          </svg>
        </button>
        <input type="text" class="nav-search-input" id="search-input" placeholder="Títulos, gente e gêneros" />
      </div>
      <button class="nav-bell-btn" title="Notificações">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span class="nav-bell-dot"></span>
      </button>
      <div class="nav-profile">
        <div class="nav-avatar" id="nav-avatar">P</div>
        <span class="nav-caret">▼</span>
        <div class="profile-dropdown">
          <a href="perfis.html" id="dropdown-name">Perfil</a>
          <hr/>
          <a href="perfis.html">Trocar Perfil</a>
          <a href="minha-lista.html">Minha Lista</a>
          <hr/>
          <a href="login.html" onclick="sessionStorage.clear()">Sair do Flixora</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- ==================== HEADER ==================== -->
  <header class="my-list-header">
    <h1>Minha Lista</h1>
    <p>Filmes e séries que você salvou para assistir depois.</p>
    <div class="list-count">
      <span>📋</span>
      <span id="list-count-text">0 itens</span>
    </div>
  </header>

  <!-- ==================== CONTENT ==================== -->
  <main class="my-list-content">
    <div id="list-container"></div>
  </main>

  <script>
    // ---- Dados dos filmes (mesmo catálogo do browse) ----
    const catalog = [
      { id: 'aurora',    title: 'Projeto Aurora',     emoji: '🌌', genre: 'Ficção Científica', bg: 'linear-gradient(135deg,#0a0a2e,#1a1a6e)' },
      { id: 'noir',      title: 'Sombra da Cidade',   emoji: '🌃', genre: 'Thriller',           bg: 'linear-gradient(135deg,#0a0a0a,#2a2a3a)' },
      { id: 'romance',   title: 'Paris Sempre',        emoji: '🗼', genre: 'Romance',             bg: 'linear-gradient(135deg,#2a0a1a,#6a0040)' },
      { id: 'samurai',   title: 'Último Samurai',      emoji: '⚔️', genre: 'Ação',               bg: 'linear-gradient(135deg,#1a0a00,#5a2a00)' },
      { id: 'jungle',    title: 'Selva de Pedra',      emoji: '🌿', genre: 'Drama',               bg: 'linear-gradient(135deg,#0a1a0a,#1a4a1a)' },
      { id: 'abyss',     title: 'O Abismo',            emoji: '🌊', genre: 'Suspense',            bg: 'linear-gradient(135deg,#001a2a,#003a6a)' },
      { id: 'ghost',     title: 'Fantasmas de Agosto', emoji: '👻', genre: 'Terror',              bg: 'linear-gradient(135deg,#0a0a1a,#1a003a)' },
      { id: 'chef',      title: 'O Grande Chef',       emoji: '👨‍🍳', genre: 'Comédia',             bg: 'linear-gradient(135deg,#1a1a00,#4a4000)' },
    ];

    // Chave usada no localStorage para guardar a lista
    const LIST_KEY = 'flixora_my_list';

    function getList() {
      try { return JSON.parse(localStorage.getItem(LIST_KEY)) || []; }
      catch(e) { return []; }
    }

    function saveList(list) {
      localStorage.setItem(LIST_KEY, JSON.stringify(list));
    }

    function removeFromList(id) {
      let list = getList().filter(item => item !== id);
      saveList(list);
      renderList();
      showToast('Removido da sua lista.');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    function renderList() {
      const list = getList();
      const container = document.getElementById('list-container');
      const countEl = document.getElementById('list-count-text');
      countEl.textContent = `${list.length} ${list.length === 1 ? 'item' : 'itens'}`;

      if (list.length === 0) {
        container.innerHTML = `
          <div class="empty-list">
            <div class="empty-icon">📭</div>
            <div class="empty-title">Sua lista está vazia</div>
            <div class="empty-sub">Adicione filmes e séries à sua lista clicando no botão <strong>+</strong> em qualquer card do catálogo.</div>
            <button class="btn-browse" onclick="window.location.href='browse.html'">Explorar Catálogo</button>
          </div>
        `;
        return;
      }

      const grid = document.createElement('div');
      grid.className = 'list-grid';

      list.forEach((id, index) => {
        const item = catalog.find(c => c.id === id) || {
          id, title: id, emoji: '🎬', genre: 'Conteúdo', bg: 'linear-gradient(135deg,#1a1a1a,#333)'
        };

        const card = document.createElement('div');
        card.className = 'list-card';
        card.style.animationDelay = `${index * 0.06}s`;
        card.innerHTML = `
          <div class="list-card-bg" style="background:${item.bg}">
            <div class="list-card-emoji">${item.emoji}</div>
            <div class="list-card-title">${item.title}</div>
            <div class="list-card-genre">${item.genre}</div>
          </div>
          <div class="list-card-overlay">
            <div class="list-card-actions">
              <button class="list-action-btn play" title="Assistir" onclick="event.stopPropagation(); alert('Recurso demonstrativo — portfólio!')">▶</button>
              <button class="list-action-btn remove" title="Remover da lista" onclick="event.stopPropagation(); removeFromList('${item.id}')">✕</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });

      container.innerHTML = '';
      container.appendChild(grid);
    }

    // ---- Navbar scroll effect ----
    const navbar = document.getElementById('browse-navbar');
    window.addEventListener('scroll', () => {
      navbar.classList.toggle('scrolled', window.scrollY > 20);
    });

    // ---- Personalize avatar ----
    const stored = sessionStorage.getItem('flixora_user');
    if (stored) {
      try {
        const user = JSON.parse(stored);
        if (user.name) {
          document.getElementById('nav-avatar').textContent = user.name[0].toUpperCase();
          document.getElementById('dropdown-name').textContent = user.name.split(' ')[0];
        }
      } catch(e) {}
    }

    // Iniciar renderização
    renderList();

    // Adicionar alguns itens de exemplo na primeira vez (UX demo)
    if (getList().length === 0) {
      const demoIds = ['aurora', 'noir', 'romance', 'abyss'];
      saveList(demoIds);
      renderList();
    }
    // ---- Search functionality ----
    const searchContainer = document.getElementById('search-container');
    const searchBtn = document.getElementById('search-btn');
    const searchInput = document.getElementById('search-input');

    if (searchBtn && searchContainer && searchInput) {
      searchBtn.addEventListener('click', () => {
        searchContainer.classList.toggle('active');
        if (searchContainer.classList.contains('active')) {
          searchInput.focus();
        }
      });

      searchInput.addEventListener('blur', () => {
        if (searchInput.value.trim() === '') {
          searchContainer.classList.remove('active');
        }
      });

      searchInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          const q = searchInput.value.trim();
          if (q) {
            alert(`Buscando por: "${q}"\n\n(Recurso demonstrativo — portfólio)`);
          }
        }
      });
    }
  </script>
</body>
</html>
